/* Layout: Ein-Hand-App. Oben Titel, Mitte scrollender Inhalt mit großen Tippflächen, unten feste Leiste mit 5 Bereichen. */
:root{
  --bg:#edf2f0; --surface:#ffffff; --sunk:#e2eae7; --ink:#10201d; --muted:#52676a; --line:#cbd8d4;
  --water:#0f5c5a; --on-water:#ffffff; --pose:#d9481a; --on-pose:#ffffff;
  --ok:#2c7a39; --warn:#9a6410; --stop:#b93227;
  --ok-bg:#dcf0df; --warn-bg:#f6e8c8; --stop-bg:#f8dcd8;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1615; --surface:#14211f; --sunk:#0f1b19; --ink:#e6efec; --muted:#93a8a4; --line:#27403b;
  --water:#5fc4bb; --on-water:#06201e; --pose:#ff7a45; --on-pose:#2a0e02;
  --ok:#74cc82; --warn:#e3b455; --stop:#f48477;
  --ok-bg:#16301b; --warn-bg:#352a10; --stop-bg:#3a1a16; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0b1615; --surface:#14211f; --sunk:#0f1b19; --ink:#e6efec; --muted:#93a8a4; --line:#27403b;
  --water:#5fc4bb; --on-water:#06201e; --pose:#ff7a45; --on-pose:#2a0e02;
  --ok:#74cc82; --warn:#e3b455; --stop:#f48477;
  --ok-bg:#16301b; --warn-bg:#352a10; --stop-bg:#3a1a16; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:680px;margin:0 auto;padding-block:12px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.2rem;font-weight:750}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.86rem}
.lat{font-style:italic;color:var(--muted);font-size:.86rem}
.head{display:flex;align-items:center;gap:10px;min-height:44px}
.head h1,.head h2{flex:1;min-width:0}
.float{width:14px;height:34px;flex:none;border-radius:7px;background:linear-gradient(var(--pose) 0 38%,var(--surface) 38% 50%,var(--ink) 50%);border:1px solid var(--line)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--pose);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;min-height:48px;font-weight:650;text-align:center}
.btn.primary{background:var(--pose);color:var(--on-pose);border-color:var(--pose);font-size:1.1rem;padding:16px}
.btn.water{background:var(--water);color:var(--on-water);border-color:var(--water)}
.btn.ghost{background:transparent}
.btn.back{padding:8px 12px;min-height:40px;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;min-height:76px;text-align:left;display:flex;flex-direction:column;gap:4px;justify-content:center}
.tile b{font-size:1.02rem;overflow-wrap:anywhere}
.tile span{color:var(--muted);font-size:.84rem}
.tile.on{border-color:var(--water);box-shadow:inset 0 0 0 2px var(--water)}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;text-align:left;display:flex;gap:10px;align-items:center;width:100%;min-height:56px}
.item .grow{flex:1;min-width:0}
.item b{display:block;overflow-wrap:anywhere}
.chev{color:var(--muted);flex:none}
.card{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card.sunk{background:var(--sunk)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;min-height:42px;font-size:.94rem}
.chip.on{background:var(--water);color:var(--on-water);border-color:var(--water);font-weight:650}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill.k{background:var(--sunk);color:var(--water);border:1px solid var(--line)}
.pill.n{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.stop{background:var(--stop-bg);color:var(--stop)}
.dots{display:inline-flex;gap:3px;flex:none}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--pose)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;font-size:.94rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.label{font-size:.76rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.steps{display:flex;gap:6px}
.steps i{height:5px;flex:1;border-radius:3px;background:var(--line)}
.steps i.f{background:var(--pose)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;min-height:48px;width:100%}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.months i{height:22px;border-radius:4px;background:var(--line);font-style:normal;font-size:.62rem;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.months i.a1{background:color-mix(in srgb,var(--water) 30%,var(--line))}
.months i.a2{background:color-mix(in srgb,var(--water) 65%,var(--line));color:var(--on-water)}
.months i.a3{background:var(--water);color:var(--on-water)}
.months i.now{outline:2px solid var(--pose);outline-offset:1px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
.notice{border-left:4px solid var(--warn);background:var(--warn-bg);border-radius:8px;padding:10px 12px;font-size:.88rem}
.notice.stop{border-color:var(--stop);background:var(--stop-bg)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
nav.tabs div{display:flex;width:100%;max-width:680px}
nav.tabs button{flex:1;min-width:0;border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;color:var(--muted);font-weight:600}
nav.tabs button.on{color:var(--pose)}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){.tile,.item,.chip,.btn{transition:transform .08s}.tile:active,.item:active,.chip:active,.btn:active{transform:scale(.98)}}
.rule{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.pill{white-space:normal}
.thumb{width:56px;height:56px;flex:none;border-radius:10px;object-fit:cover;background:var(--sunk)}
.photo{margin:0;display:flex;flex-direction:column;gap:4px}
.photo img{width:100%;max-width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:var(--r);background:var(--sunk);display:block}
.photo figcaption{font-size:.72rem;color:var(--muted);overflow-wrap:anywhere}
.card .photo img{aspect-ratio:16/9}
a{color:var(--water)}
details summary{cursor:pointer;min-height:32px}
.chain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.chain li{display:flex;align-items:center;gap:12px;min-height:48px}
.chain li>span{display:flex;flex-direction:column;min-width:0;padding:4px 0}
.chain li.end{font-size:.76rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-height:0;padding:0 0 4px 60px}
.part{width:48px;height:48px;flex:none;align-self:stretch;min-height:48px;overflow:visible}
.part .ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.part .ln.b{stroke-width:2.6}.part .ln.d{stroke-width:1.2;stroke-dasharray:5 3}
.part .st{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
.part .hk{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.part .fm{fill:var(--muted);stroke:var(--ink);stroke-width:1.2}
.part .fw{fill:var(--water);stroke:var(--ink);stroke-width:1.2}
.part .fp{fill:var(--pose);stroke:var(--ink);stroke-width:1.2}
.part .fs{fill:var(--sunk);stroke:var(--ink);stroke-width:1.4}
.part .wm{fill:none;stroke:var(--pose);stroke-width:3;stroke-linecap:round}
.part .eye{fill:var(--surface)}
.stepsl{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.stepsl li{counter-increment:s;display:flex;gap:10px;align-items:flex-start}
.stepsl li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--water);color:var(--on-water);font-weight:750;font-size:.86rem;display:flex;align-items:center;justify-content:center}
.photo.fit img{aspect-ratio:auto;object-fit:contain;background:#fff}
a.btn{display:block;text-decoration:none;color:inherit}
nav.tabs button{font-size:.62rem;padding-left:0;padding-right:0}
nav.tabs svg{width:22px;height:22px}
.anim{display:flex;flex-direction:column;gap:10px}
.stage{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);aspect-ratio:4/5;max-height:70vh}
.stage svg{position:absolute;inset:0;width:100%;height:100%;transition:opacity .5s}
.stage .scene{opacity:0}.anim[data-k="water"] .scene{opacity:1}.anim[data-k="water"] .build{opacity:0}
.build .guide{stroke:var(--line);stroke-width:1.2}
.build .bp{opacity:0;transform:translateY(-26px);transition:opacity .45s,transform .45s cubic-bezier(.3,1.4,.5,1)}
.build .bp.on{opacity:1;transform:none}
.build .tag{fill:var(--sunk);stroke:var(--line)}.build .bp.cur .tag{fill:var(--pose);stroke:var(--pose)}
.build text{font:650 13px var(--font);fill:var(--ink)}.build .bp.cur text{fill:var(--on-pose)}
.anim:not(.started) .build .bp{opacity:.35;transform:none}
.bigplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;border:0;background:var(--pose);color:var(--on-pose);font-size:1.8rem;padding-left:6px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.anim.started .bigplay{display:none}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--pose);transition:width .4s}
.cap{background:var(--water);color:var(--on-water);border-radius:12px;padding:12px 14px;font-weight:650;min-height:4.9em;display:flex;align-items:center}
.scene .w0{stop-color:#7fc4c0}.scene .w1{stop-color:#0f5c5a}
.scene .ray{fill:#fff;opacity:.07}.scene .surf{fill:#eaf6f4;opacity:.75}.scene .sand{fill:#d9b877}
.scene .weed path{fill:none;stroke:#2c7a39;stroke-width:5;stroke-linecap:round}
.scene{--ink:#0c1b19;--surface:#fff;--sunk:#e8eeec;--muted:#6b7f80;--water:#f2c230;--pose:#e2501e}
.scene .ln{stroke:#0c1b19;opacity:.8}
.scene .pred{transform:translateX(-140px);transition:transform 1.4s cubic-bezier(.5,0,.2,1)}
.scene .pb{fill:#5d7f3a;stroke:#0c1b19;stroke-width:1.4;stroke-linejoin:round}.scene .pf{fill:#44632a;stroke:#0c1b19;stroke-width:1.2;stroke-linejoin:round}
.scene .pl{fill:none;stroke:#e9e2b0;stroke-width:3;opacity:.55;stroke-linecap:round}.scene .pe{fill:#f6e9a8;stroke:#0c1b19}.scene .pm{fill:none;stroke:#0c1b19;stroke-width:1.4;stroke-linecap:round}
.anim[data-k="water"] .pred{transform:translateX(calc(var(--px) - 70px))}
.anim.bite .pred{transform:translateX(var(--px));transition-duration:.22s}
.scene .mtag rect{fill:#fff;stroke:#0c1b19;stroke-width:1.2}.scene .mtag text{font:italic 700 14px var(--font);fill:#0c1b19}
.anim.bite .mtag rect{fill:#e2501e}.anim.bite .mtag text{fill:#fff}
@media (prefers-reduced-motion:no-preference){
.anim[data-k="water"] .mv.hop{animation:hop 3.4s linear infinite}
.anim[data-k="water"] .mv.drag{animation:drag 3.4s ease-in-out infinite}
.anim[data-k="water"] .mv.swim{animation:swim 3.4s ease-in-out infinite}
.anim[data-k="water"] .mv.sink{animation:sink 3.4s ease-in-out infinite}
.anim[data-k="water"] .mv.vert{animation:vert 1.7s ease-in-out infinite}
.anim[data-k="water"] .mv.float{animation:bob 1.7s ease-in-out infinite}
.anim[data-k="water"] .jit{animation:jit .5s ease-in-out infinite}
.anim.bite .mv{animation-play-state:paused!important}
.anim.bite .mv.float{animation:dip .5s forwards!important;animation-play-state:running!important}
.scene .weed path{animation:sway 4s ease-in-out infinite;transform-origin:50% 100%}}
@keyframes hop{0%{transform:translate(-60px,0)}15%{transform:translate(-36px,-58px)}40%{transform:translate(0,0)}50%{transform:translate(0,0)}65%{transform:translate(24px,-58px)}90%{transform:translate(60px,0)}100%{transform:translate(60px,0)}}
@keyframes drag{0%{transform:translateX(-60px)}35%{transform:translateX(-10px)}55%{transform:translateX(-10px)}90%{transform:translateX(50px)}100%{transform:translateX(50px)}}
@keyframes swim{0%{transform:translate(-70px,10px)}50%{transform:translate(0,-6px)}100%{transform:translate(70px,10px)}}
@keyframes sink{0%{transform:translate(0,-150px) rotate(-6deg)}70%{transform:translate(0,120px) rotate(6deg)}100%{transform:translate(0,120px)}}
@keyframes vert{0%,100%{transform:translateY(40px)}50%{transform:translateY(-40px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@keyframes dip{to{transform:translateY(46px)}}
@keyframes jit{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(2px,-5px) rotate(8deg)}}
@keyframes sway{0%,100%{transform:skewX(-4deg)}50%{transform:skewX(4deg)}}
.lk{display:inline;border:0;background:none;padding:0;margin:0;font:inherit;color:var(--water);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;text-align:inherit;cursor:pointer}
h3 .lk{color:inherit}
.stepsl li>span{flex:1;min-width:0}
/* Fangbuch */
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cth{width:56px;height:56px;flex:none;border-radius:10px;object-fit:cover;background:var(--sunk);display:block}
.cth.none{border:1px dashed var(--line)}
.cbad{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.cbad:empty{display:none}.cbad .pill{font-size:.68rem;padding:2px 8px}
.cprev img{width:100%;max-height:60vh;object-fit:contain;border-radius:var(--r);background:var(--sunk);display:block}
.cfull img{max-height:70vh}
label.btn{display:flex;align-items:center;justify-content:center;cursor:pointer}
input.vh:focus-visible+*,label.btn:focus-within{outline:2px solid var(--pose);outline-offset:2px}
.field.grow{flex:1;min-width:120px}
.mbars{display:flex;gap:4px;align-items:flex-end;height:120px;padding-top:16px}
.mbars span{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:2px;min-width:0}

.av.big{width:112px;height:112px;font-size:2.4rem}
.pcenter{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}.pcenter h2,.pcenter p{margin:0}
.pstats{display:flex;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.pstats span{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px;font-size:.78rem;color:var(--muted)}.pstats b{font-size:1.3rem;color:var(--ink,inherit)}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.badge b{font-size:.86rem}
.badge{border:1px dashed var(--line);border-radius:var(--r);padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:2px;opacity:.55;overflow-wrap:anywhere}
.badge.on{opacity:1;border-style:solid;border-color:var(--pose);background:var(--surface)}.badge.on b{color:var(--pose)}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.pgrid button{border:0;padding:0;background:none;aspect-ratio:1}.pgrid img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
/* Angelstellen-Film */
.anim.spot .scene{opacity:1}
.spotsc .sky{fill:#cfe6ef}.spotsc .surfl{fill:none;stroke:#fff;stroke-width:2.5;opacity:.85}
.spotsc .sand{stroke:#b08f52;stroke-width:1.5}.spotsc .grass{fill:none;stroke:#4f8a3a;stroke-width:6;stroke-linecap:round}

 s:["Schnurende doppelt legen (Schlaufe).","Mit der Doppelschnur einen Überhandknoten binden.","Die Schlaufe ein zweites Mal durch den Knoten führen.","Anfeuchten und festziehen."]},
{id:"schlaufe2",n:"Schlaufe in Schlaufe",fuer:"Vorfach an Hauptschnur ohne Wirbel",schnur:"alle",lvl:"leicht",kraft:"–",
 s:["Die Schlaufe der Hauptschnur durch die Vorfachschlaufe stecken.","Das Vorfachende mit dem Haken durch die Schlaufe der Hauptschnur führen.","Zuziehen. Die Schlaufen müssen flach ineinanderliegen wie ein Kreuzknoten."],tipp:"Liegt eine Schlaufe als Schlinge um die andere, schneidet sie ein. Dann neu legen."},
{id:"rapala",n:"Schlaufenknoten (Rapala-Knoten)",fuer:"Kunstköder und Fliegen, die frei spielen sollen",schnur:"Monofil, Fluorocarbon",lvl:"mittel",kraft:"ca. 85 %",
 s:["12 cm vor dem Ende einen lockeren Überhandknoten in die Schnur legen.","Ende durch das Köderöhr und zurück durch den Überhandknoten führen.","Ende 3 Mal um die Hauptschnur wickeln.","Ende zurück durch den Überhandknoten führen und dann durch die dabei entstandene Schlaufe.","Anfeuchten und festziehen. Vor dem Öhr bleibt eine kleine offene Schlaufe."]},
{id:"dropper",n:"Seitenarm-Schlaufe (Dropper Loop)",fuer:"Seitenarm für Beifänger, Paternoster",schnur:"Monofil, Fluorocarbon",lvl:"mittel",kraft:"ca. 80 %",
 s:["Einen Kreis in die Schnur legen.","Eine Seite des Kreises 5–6 Mal um die Kreuzungsstelle wickeln.","In der Mitte der Wicklungen eine Öffnung halten und den gegenüberliegenden Kreisbogen hindurchstecken.","Diesen Bogen festhalten, anfeuchten und an beiden Schnurenden ziehen.","Die Schlaufe steht jetzt seitlich ab. Haken einschlaufen oder einen Schenkel der Schlaufe durchschneiden: fertig ist der Seitenarm."]},
{id:"blut",n:"Blutknoten",fuer:"Zwei ähnlich dicke Monoschnüre verbinden (Vorfachspitze)",schnur:"Monofil, Fluorocarbon",lvl:"mittel",kraft:"ca. 85 %",
 s:["Beide Schnüre 15 cm überlappen.","Ein Ende 5 Mal um die andere Schnur wickeln und zurück in die Mitte zwischen beide Schnüre stecken.","Das andere Ende 5 Mal in Gegenrichtung wickeln und von der anderen Seite durch dieselbe Öffnung stecken.","Anfeuchten, an beiden Hauptschnüren ziehen, Enden kürzen."]},
{id:"noknot",n:"No-Knot (knotenloser Knoten)",fuer:"Öhrhaken mit Haar für Boilie und Pellet",schnur:"Vorfachgeflecht, Mono",lvl:"leicht",kraft:"ca. 95 %",
 s:["Kleine Schlaufe für den Köder ans Vorfachende binden.","Vorfach von hinten durch das Öhr führen (von der Rückseite zur Hakenspitze hin) und die Haarlänge einstellen.","Das Haar am Schenkel anlegen. Mit der langen Schnur 7–8 Mal eng um Schenkel und Haar wickeln, Richtung Hakenbogen.","Die Schnur wieder von hinten durch das Öhr führen.","Festziehen."]},
{id:"plaettchen",n:"Plättchenhaken binden",fuer:"Haken ohne Öhr (Friedfisch, Forelle, Aal)",schnur:"Monofil, Fluorocarbon",lvl:"mittel",kraft:"ca. 90 %",
 s:["Schnur am Hakenschenkel entlanglegen und eine Schlaufe bilden, das Ende zeigt zum Plättchen.","Mit dem Ende 6–8 Mal durch die Schlaufe um Schenkel und Schnur wickeln (wie beim Uni-Knoten).","Anfeuchten, an beiden Enden zuziehen und den Knoten bis ans Plättchen schieben.","Die Schnur muss auf der Innenseite des Plättchens abgehen, also zur Hakenspitze hin."],tipp:"Fertig gebundene Vorfachhaken sparen am Wasser viel Zeit."},
{id:"stopper",n:"Stopperknoten",fuer:"Stopper für die Laufpose",schnur:"Stopperfaden auf der Hauptschnur",lvl:"leicht",kraft:"–",url:"https://www.netknots.com/fishing_knots/bobber-stopper-knot",
 s:["Ein 20 cm langes Stück Stopperfaden parallel an die Hauptschnur legen und eine Schlaufe bilden.","Ende 4–5 Mal durch die Schlaufe um die Hauptschnur wickeln.","Beide Enden zuziehen und auf 1 cm kürzen (so gleiten sie durch die Ringe).","Der Knoten lässt sich verschieben: So stellst du die Angeltiefe ein."]},
{id:"arbor",n:"Arbor-Knoten",fuer:"Schnur auf die Rollenspule",schnur:"alle",lvl:"leicht",kraft:"–",url:"https://www.animatedknots.com/arbor-knot",
 s:["Schnur um die Spule legen.","Mit dem Ende einen Überhandknoten um die Hauptschnur binden.","Ins Ende einen zweiten Überhandknoten als Stopper binden.","Zuziehen und an die Spule schieben."],tipp:"Bei Geflecht vorher etwas Mono unterfüttern oder ein Stück Klebeband auf die Spule, sonst rutscht die Schnur durch."},
{id:"crimp",n:"Quetschhülse (Stahlvorfach)",fuer:"Stahl, Titan und dickes Mono an Wirbel, Haken, Snap",schnur:"Stahl 7×7, 1×7, Titan, Hardmono",lvl:"leicht",kraft:"ca. 90 %",
 s:["Hülse aufs Vorfach schieben. Das Ende durch Wirbel oder Haken und zurück durch die Hülse führen, eine kleine Schlaufe lassen.","Bei weichem 7×7-Stahl das Ende ein zweites Mal durch die Hülse führen.","Mit der Quetschhülsenzange zweimal quetschen, die Ränder der Hülse dabei frei lassen.","Kräftig auf Zug prüfen."],tipp:"Die Hülse muss zum Durchmesser passen. Mit einer Kombizange gequetschte Hülsen schneiden das Vorfach an."}
];

 st:["Krautfeld: Wasserpflanzen liefern Sauerstoff, Deckung und Futter. Wo das Kraut endet, entsteht eine Kante, an der Räuber auf vorbeiziehende Beute warten.",

 "Führe den Köder knapp über den Krautspitzen oder an der Kante entlang. Tippt er ins Kraut, mit einem kurzen Ruck befreien. Genau dann beißt oft der Hecht.",

 "Zu tief laufende Köder, die bei jedem Wurf Kraut sammeln. Flach laufende oder krautfeste Köder nehmen und den Haken nach jedem Wurf prüfen."],

 "Lass den Köder mit der Strömung in die Rinne treiben und hol ihn langsam an der Strömungskante entlang ein. Zwischendurch immer wieder stehen lassen.",
 "Besonders gut ist der Einlauf im Hochsommer, wenn das Wasser im See warm und sauerstoffarm ist, und nach Regen, wenn er Futter einspült.",

 st:["Brückenpfeiler: Der Pfeiler bricht die Strömung. Dahinter entsteht ruhiges Wasser, daneben spült der Fluss tiefe Löcher aus. Dazu kommt der Schatten der Brücke.",
 "Zander, Barsch und Wels stehen im Strömungsschatten hinter dem Pfeiler und im ausgespülten Loch. Rapfen und Döbel jagen an der Kante zwischen schnellem und ruhigem Wasser.",
 "Wirf dicht neben den Pfeiler in die Strömung, etwas stromauf. Der Köder wird dann von selbst hinter den Pfeiler ins ruhige Wasser gedrückt.",
 "Lass den Köder im Strömungsschatten zum Grund sinken und zupfe ihn langsam durch das Loch. Halte Kontakt, die Bisse kommen beim Absinken.",
 "Nachts sind beleuchtete Brücken ein Hotspot: Das Licht lockt Kleinfisch, und die Zander jagen an der Grenze zwischen Licht und Schatten.",
 "Nur die Flussmitte befischen. Jeder Pfeiler hat sein eigenes Loch, auch der am Ufer. Vorher prüfen, ob das Angeln an der Brücke erlaubt ist."],

 bot:[[0,330],[90,320],[150,200],[190,160],[230,170],[280,290],[360,330]],deco:[],ang:["boat",316],to:188,path:[[190,148],[244,186],[284,282]],fish:[[204,138,1],[250,176,1],[276,248,1]],mt:"den Hang hinunter jiggen",
 st:["Barschberg: Eine Erhebung mitten im See, deren Kuppe oft nur wenige Meter unter der Oberfläche liegt. Rundherum ist es tief. Solche Berge sind Sammelplätze für Futterfisch.",

 "Jagende Möwen und spritzende Kleinfische an der Oberfläche zeigen dir, dass die Barsche gerade oben rauben. Dann schnell einen Oberflächenköder oder Spinner hinterher.",
 "Mit dem Boot direkt über die Kuppe fahren. Das vertreibt den Schwarm. Abstand halten, den Anker leise setzen oder driften."],

 bot:[[0,62],[28,84],[50,130],[110,160],[150,236],[215,240],[250,150],[360,128]],deco:[["flow",318,108,-1],["flow",276,112,-1],["rock",252,150]],ang:["bank",14],to:270,path:[[266,116],[222,190],[162,216]],fish:[[226,196,1],[196,224,1],[160,214,1]],mt:"in den Gumpen treiben lassen",
 st:["Gumpen: Eine tiefe, ausgespülte Stelle im Bach, meist hinter einer flachen Rausche, einem Stein oder einer Stufe. Hier ist das Wasser ruhig und tief, das Futter kommt von selbst angetrieben.",
 "Die größte Forelle steht am Einlauf des Gumpens, wo die Strömung das Futter bringt. Weitere Forellen, Äschen und Döbel stehen dahinter, alle mit dem Kopf gegen die Strömung.",
 "Nähere dich von unten, also gegen die Strömung, dann sehen dich die Fische nicht. Wirf über den Gumpen hinaus in das flache, schnelle Wasser oberhalb.",
 "Lass den Köder mit der Strömung in den Gumpen treiben und führe ihn nur etwas schneller als das Wasser. Der Biss kommt meist am Einlauf oder am tiefsten Punkt.",
 "Ein Gumpen verträgt nur wenige Würfe. Der erste Wurf ist der wichtigste, danach weiterziehen und später wiederkommen.",
 "Aufrecht ans Ufer treten. Forellen sehen und spüren dich sofort. Geduckt und leise anpirschen und den eigenen Schatten vom Wasser fernhalten."],
 b:["spinner","wobbler_flach","inline_spoon","nymphe","trockenfliege","streamer","tauwurm"],r:["spinn","fliege","springer","duo","laufpose","tiroler"]},
{id:"aussenkurve",n:"Außenkurve",a:["Außenkurve","Außenkurven","Prallhang","Flussbiegung"],w:["fluss","strom","bach"],f:["zander","wels","barbe","doebel","rapfen","barsch","aal","huchen","bachforelle"],
 bot:[[0,62],[30,84],[50,100],[160,150],[250,232],[312,250],[334,170],[344,84],[360,58]],deco:[["bush",346]],ang:["bank",14],to:316,path:[[314,126],[300,238],[238,214]],fish:[[296,222,-1],[262,232,-1],[318,172,-1]],mt:"durch die Rinne treiben lassen",
 st:["Außenkurve: In der Flussbiegung drückt die Strömung nach außen. Dort gräbt sie eine tiefe Rinne und unterspült das Ufer. Innen lagert sich Sand ab, dort ist es flach.",
 "Die Fische stehen außen in der tiefen Rinne und unter dem unterspülten Ufer: Zander, Wels, Barbe und Döbel. Am Übergang von flach zu tief jagen Rapfen und Barsch.",
 "Stell dich an die flache Innenseite und wirf quer hinüber, dicht vor das gegenüberliegende Ufer. Dort nimmt die Strömung den Köder gleich mit.",
 "Lass den Köder an gespannter Schnur absinken und im Bogen durch die Rinne zu dir herumtreiben. Am Ende des Bogens kurz stehen lassen, dann langsam einholen.",
 "Überhängende Büsche und Wurzeln an der Außenkurve sind zusätzliche Hotspots. Für Barbe und Wels ist die Rinne ein klassischer Ansitzplatz mit Grundmontage.",
 "Direkt am Prallhang stehen. Das Ufer ist oft unterspült und kann abbrechen, und die Fische stehen genau unter dir."],

{id:"steinpackung",n:"Steinpackung",a:["Steinpackung","Steinpackungen","Steinschüttung"],w:["kanal","strom","fluss","hafen","talsperre","fels"],f:["barsch","zander","aal","wels","rapfen","quappe","wolfsbarsch"],
 bot:[[0,60],[40,84],[60,100],[130,200],[180,230],[360,250]],deco:[["riprap",36,150]],ang:["bank",18],to:256,path:[[254,236],[184,222],[118,172]],fish:[[176,206,-1],[128,158,-1],[226,226,-1]],mt:"langsam über die Steine",
 st:["Steinpackung: Aufgeschüttete Steine sichern Ufer an Kanälen, Flüssen und Häfen. In den Lücken leben Krebse, Grundeln und Kleinfisch, ein gedeckter Tisch für Räuber.",
 "Barsch, Zander und Aal stehen direkt an den Steinen, besonders am Fuß der Packung, wo sie in den weichen Grund übergeht. Nachts kommen die Zander bis ins knietiefe Wasser.",
 "Wirf nicht gerade hinaus, sondern schräg oder parallel zum Ufer. So bleibt der Köder die ganze Zeit in der fängigen Zone an den Steinen.",
 "Führe den Köder langsam knapp über den Steinen und lass ihn immer wieder kurz aufsetzen. Am Übergang zum weichen Grund besonders gründlich fischen.",
 "In der Dämmerung und nachts flach laufende Wobbler ganz langsam parallel zur Packung einholen. Das ist eine der sichersten Methoden auf Zander.",
 "Zu schweres Blei, das zwischen den Steinen verklemmt. Leicht fischen, die Rute hoch halten und Montagen mit schlankem Blei wählen."],
 b:["wobbler_flach","gummifisch","creature","dropshot","tauwurm","koederfisch"],r:["cheburashka","texas","dropshot","jigkopf","tiroler"]},
{id:"rinne",n:"Brandungsrinne und Sandbank",a:["Brandungsrinne","Sandbank","Sandbänke","Rinne"],w:["brandung","lagune","flats"],f:["plattfisch","dorsch","meerforelle","wolfsbarsch","steinbutt","aal","hornhecht"],
 bot:[[0,60],[40,84],[60,100],[110,172],[160,180],[210,126],[250,122],[300,190],[360,220]],deco:[["foam",206,256]],ang:["bank",18],to:150,path:[[152,170],[140,172],[126,168]],fish:[[128,158,-1],[166,166,-1],[304,178,-1]],mt:"liegen lassen · ein Stück ziehen",
 st:["Brandungsrinne: Vor dem Strand wechseln sich Sandbänke und tiefere Rinnen ab. Die Wellen spülen in den Rinnen Würmer, Krebse und Muscheln frei, dort fressen die Fische.",
 "Plattfische und Dorsche ziehen in den Rinnen entlang, bei Dunkelheit und auflaufendem Wasser bis dicht vor den Strand. Meerforelle und Wolfsbarsch jagen an den Kanten der Sandbank.",
 "Lies zuerst das Wasser: Wo die Wellen brechen, liegt eine Sandbank. Das ruhigere, dunklere Wasser davor und dahinter ist die Rinne. Dort hinein muss der Köder.",
 "Lass die Montage in der Rinne liegen und zieh sie alle paar Minuten ein kleines Stück heran. Das wirbelt Sand auf und lockt Plattfische an.",
 "Die beste Zeit ist die Dämmerung bei auflandigem Wind und leicht angetrübtem Wasser. Durchbrüche in der Sandbank sind die Wege, auf denen die Fische in die Rinne ziehen.",
 "Immer so weit wie möglich werfen. Oft liegt die erste Rinne nur 20 bis 40 Meter vor dem Strand, und der Köder fliegt über die Fische hinweg."],
 b:["wattwurm","seeringler","kuestenblinker","fetzen","garnele"],r:["brandung","pulley","buttloeffel","nachlaeufer","sbirolino"]}

// Angelarten: Anleitungen von der Ausrüstung bis zur Technik
window.METHODS=[
{id:"fliegenfischen",n:"Fliegenfischen",kurz:"Die Schnur trägt den Köder: Trockenfliege, Nymphe und Streamer",f:["bachforelle","regenbogen","aesche","saibling","doebel","hecht","meerforelle","lachs","huchen","rapfen","barsch"],
 info:"Beim Fliegenfischen wirfst du nicht den Köder, sondern die schwere Fliegenschnur. Sie trägt die fast gewichtslose Fliege zum Fisch. Das macht die Methode leise und genau, und sie ist leichter zu lernen, als ihr Ruf sagt.",
 geraet:[["Rute","Für Bach und Forellensee Klasse 4 bis 6 in 2,60 bis 2,75 m. Für Hecht und Meerforelle Klasse 7 bis 9. Die Klasse von Rute, Rolle und Schnur muss zusammenpassen."],["Rolle","Einfache Fliegenrolle passend zur Schnurklasse. Bei Forellen ist sie nur Schnurspeicher, bei großen Fischen braucht sie eine gute Bremse."],["Schnur","Schwimmschnur mit Keule vorn (WF, Weight Forward) als Erstes. Sinkschnur oder Sinkspitze erst später für Streamer in der Tiefe."],["Backing","20 bis 50 m dünne Füllschnur unter der Fliegenschnur, als Reserve im Drill."],["Vorfach","Verjüngtes Vorfach, etwa so lang wie die Rute, mit Spitze 0,14 bis 0,18 mm für Forellen. Für Hecht ein kurzes Vorfach mit Stahl oder Titan."],["Fliegen","Für den Anfang reichen je zwei Muster: Trockenfliege, Goldkopf-Nymphe und Streamer."],["Dazu","Polbrille, Kescher, Schwimmpaste für Trockenfliegen, Lösezange. Am Bach Wathose oder Watstiefel."]],
 sek:[["Aufbau der Montage",["Backing mit dem Arbor-Knoten auf die Spule binden und straff aufkurbeln.","Fliegenschnur mit dem Albright-Knoten ans Backing knoten. Das dünne Ende der Schnur zeigt zum Backing, die Keule nach vorn.","Vorfach über Schlaufe in Schlaufe an die Fliegenschnur hängen.","Fliege mit dem Verbesserten Clinchknoten anbinden. Bei Streamern gibt der Rapala-Knoten mehr Spiel."]],
 ["Der Grundwurf (Überkopfwurf)",["Zieh etwa 8 m Schnur ab und leg sie gerade vor dir aufs Wasser oder auf eine Wiese. Übe zuerst auf der Wiese, ohne Haken.","Rückschwung: Rutenspitze tief starten, zügig beschleunigen und bei etwa 1 Uhr hart stoppen. Das Handgelenk bleibt fest.","Warten, bis sich die Schnur hinter dir fast ganz gestreckt hat. Schau anfangs ruhig nach hinten.","Vorschwung: wieder beschleunigen und bei etwa 10 Uhr hart stoppen. Die Schnur rollt als enge Schlaufe nach vorn ab.","Erst wenn die Schnur gestreckt ist, die Rutenspitze senken und ablegen.","Merksatz: Die Rute arbeitet zwischen 10 und 1 Uhr. Kraft bringt nichts, der saubere Stopp macht den Wurf."]],
 ["Der Rollwurf",["Den brauchst du, wenn hinter dir Büsche oder eine Böschung stehen.","Rute langsam nach hinten oben führen, bis die Schnur als Bogen hinter deiner Schulter hängt. Die Schnurspitze bleibt auf dem Wasser liegen.","Dann zügig nach vorn beschleunigen und auf Augenhöhe stoppen. Die Schnur rollt über das Wasser ab."]],
 ["Trockenfliege",["Die Fliege schwimmt auf der Oberfläche und ahmt ein Insekt nach. Du siehst den Biss, das ist die schönste Art.","Wirf stromauf oder schräg stromauf, etwa einen Meter oberhalb des steigenden Fisches.","Die Fliege muss frei treiben, ohne dass die Schnur an ihr zieht. Lose Schnur beim Treiben mit der Hand einholen.","Nimmt der Fisch die Fliege, kurz warten und die Rute dann ruhig anheben."]],
 ["Nymphe",["Die Nymphe treibt unter Wasser, dort fressen Forellen und Äschen die meiste Zeit.","Stromauf werfen und die Nymphe am Grund entlangtreiben lassen. Die Schnurspitze oder ein Bissanzeiger zeigt den Biss.","Bleibt die Schnur stehen oder zuckt sie, sofort die Rute anheben.","Gut für den Start ist das Duo: oben eine schwimmende Trockenfliege als Bissanzeiger, darunter die Nymphe."]],
 ["Streamer",["Der Streamer ahmt ein Fischchen nach und bringt die großen Forellen, Hechte, Barsche und Rapfen.","Quer oder schräg stromab werfen, kurz absinken lassen und in kurzen Zügen mit der Schnurhand einholen.","Tempo wechseln und Pausen einbauen. Der Biss ist ein harter Ruck in der Schnurhand.","Anhieb mit der Schnurhand setzen, also Schnur festhalten und ziehen, erst dann die Rute heben."]]],
 fehler:["Zu viel Kraft und ein lockeres Handgelenk. Die Schnur fällt dann in sich zusammen. Weniger Kraft, sauberer Stopp.","Zu früh nach vorn werfen. Es knallt wie eine Peitsche und die Fliege ist weg. Warten, bis die Schnur hinten gestreckt ist.","Im Wasser trampeln oder den Schatten aufs Wasser werfen. Forellen flüchten sofort.","Regeln übersehen: Viele Fliegenstrecken erlauben nur Fliege, oft ohne Widerhaken, und haben eigene Entnahmegrenzen."],
 b:["trockenfliege","nymphe","streamer","hechtfliege","meeresfliege"],r:["fliege","springer","duo"],s:["gumpen","einlauf","aussenkurve","schilf"],k:["arbor","albright","schlaufe2","clinch","rapala","chirurg"]},
{id:"spinnfischen",n:"Spinnfischen",kurz:"Aktiv mit Kunstködern auf Raubfisch",f:["hecht","zander","barsch","rapfen","bachforelle","wels","meerforelle","dorsch","wolfsbarsch"],
 info:"Du wirfst einen Kunstköder aus, holst ihn ein und ahmst so einen Beutefisch nach. Du bist ständig in Bewegung und suchst die Fische, statt auf sie zu warten.",
 geraet:[["Rute","Für Barsch 2,10 bis 2,40 m mit 5 bis 25 g Wurfgewicht, für Zander und Hecht 2,40 bis 2,70 m mit 15 bis 60 g."],["Rolle","Stationärrolle Größe 2500 für Barsch, 3000 bis 4000 für Zander und Hecht."],["Schnur","Geflochtene Schnur 0,10 bis 0,15 mm. Sie dehnt sich nicht, du spürst jeden Biss."],["Vorfach","Ein Meter Fluorocarbon 0,25 bis 0,35 mm. Wo Hechte vorkommen, immer ein Stahl- oder Titanvorfach davor."],["Dazu","Kescher, lange Lösezange, Seitenschneider, Polbrille."]],
 sek:[["So fängst du an",["Geflochtene Schnur und Vorfach mit dem Doppelten Uni oder dem FG-Knoten verbinden, den Köder in einen Karabiner einhängen.","Suche Struktur: Kanten, Schilf, Buhnen, Stege, Krautfelder. Im freien Wasser stehen selten Fische.","Wirf die Stelle im Fächer ab, also jeden Wurf ein Stück weiter nach rechts. Nach zehn Würfen ohne Kontakt weitergehen.","Stell die Bremse so ein, dass du Schnur gerade noch mit der Hand abziehen kannst."]],
 ["Die vier Führungen",["Einleiern: gleichmäßig einholen. Richtig für Spinner, Blinker und Wobbler.","Faulenzen: Köder zum Grund sinken lassen, zwei bis drei Kurbelumdrehungen, wieder sinken lassen. Die Rute bleibt ruhig. Die beste Methode mit Gummifisch auf Zander.","Jiggen: den Köder mit der Rutenspitze vom Grund anheben und an gespannter Schnur absinken lassen.","Twitchen: Wobbler mit kurzen Schlägen aus dem Handgelenk zur Seite ausbrechen lassen, dazwischen Pausen."]],
 ["Der Biss",["Die meisten Bisse kommen, wenn der Köder absinkt oder steht. Die Schnur dabei immer gespannt halten und beobachten.","Ein Ruck, ein Tock oder eine plötzlich schlaffe Schnur: sofort kräftig anschlagen.","Im Drill die Rute hochhalten und den Fisch über die Bremse arbeiten lassen. Nicht kurbeln, während die Bremse läuft."]]],
 fehler:["Zu schnell führen. Vor allem bei kaltem Wasser gilt: halb so schnell, doppelt so viele Bisse.","Auf Stahlvorfach verzichten, wo Hechte leben. Der Fisch schwimmt dann mit dem Köder im Maul davon.","Immer nur an derselben Stelle stehen. Spinnfischen heißt Strecke machen.","Den Köder zu schwer wählen. Er soll zwei bis drei Sekunden zum Grund brauchen."],
 b:["gummifisch","wobbler_flach","spinner","blinker","jerkbait","topwater_popper","twister"],r:["jigkopf","texas","dropshot","carolina","spinn","cheburashka"],s:["kante","schilf","buhne","steinpackung","bruecke","kraut"],k:["doppeluni","fg","clinch","palomar"]},
{id:"posenangeln",n:"Posenangeln",kurz:"Der Klassiker: Die Pose zeigt den Biss",f:["rotauge","brasse","schleie","karpfen","rotfeder","barsch","aal","hecht","regenbogen","doebel"],
 info:"Die Pose trägt den Köder in der gewünschten Tiefe und zeigt dir jeden Biss. Die Methode ist einfach und vielseitig und der beste Einstieg ins Angeln.",
 geraet:[["Rute","Matchrute oder leichte Posenrute 3,60 bis 3,90 m, alternativ eine Bolognese- oder Stipprute."],["Rolle","Kleine Stationärrolle Größe 2000 bis 3000."],["Schnur","Monofile Schnur 0,16 bis 0,22 mm. Sie soll sinken, dann hat der Wind weniger Angriffsfläche."],["Posen","Schlanke Posen für stehendes Wasser, bauchige für Strömung und Wind. Tragkraft 1 bis 4 g für den Anfang."],["Vorfach","Fertige Vorfachhaken Größe 10 bis 16, etwas dünner als die Hauptschnur."]],
 sek:[["Montage",["Feststellpose: Pose mit Gummis auf die Schnur klemmen. Geht bis zu einer Wassertiefe von etwa einer Rutenlänge.","Laufpose: Für tieferes Wasser. Stopperknoten, Perle, Pose, Blei, Wirbel, Vorfach. Der Stopper bestimmt die Tiefe.","Die Pose mit Bleischrot so austarieren, dass nur noch die farbige Spitze herausschaut. Dann spürt der Fisch keinen Widerstand."]],
 ["Tiefe ausloten",["Ein Lotblei an den Haken hängen und auswerfen.","Geht die Pose unter, steht sie zu flach. Liegt sie flach auf dem Wasser, steht sie zu tief.","Für Friedfische den Köder knapp über Grund oder leicht aufliegend anbieten. Das ist der wichtigste Schritt beim Posenangeln."]],
 ["Anfüttern und Biss",["Wenige kleine Futterballen an die Pose werfen, dann regelmäßig ein paar Maden oder Körner nachlegen. Wenig, aber oft.","Immer auf dieselbe Stelle werfen und füttern, so sammelst du die Fische.","Biss: Die Pose zuckt, wandert, taucht ab oder hebt sich. Bei Rotaugen sofort anschlagen, bei Schleie und Karpfen warten, bis sie abzieht."]]],
 fehler:["Nicht ausloten. Wer die Tiefe nicht kennt, angelt am Fisch vorbei.","Die Pose zu hoch aus dem Wasser schauen lassen. Vorsichtige Fische lassen den Köder dann wieder los.","Zu viel füttern. Satte Fische beißen nicht.","Zu dicke Schnur und zu große Haken. Feiner fängt fast immer mehr."],
 b:["made","mais","tauwurm","rotwurm","brot","teig_forelle","koederfisch"],r:["feststellpose","laufpose","hechtpose"],s:["schilf","seerosen","steg","kraut","einlauf"],k:["stopper","chirurg","schlaufe2","clinch","plaettchen"]},
{id:"grundangeln",n:"Grundangeln",kurz:"Der Köder liegt am Grund, die Rutenspitze meldet",f:["aal","karpfen","brasse","barbe","schleie","zander","wels","quappe","plattfisch"],
 info:"Blei und Köder liegen am Gewässergrund, dort, wo viele Fische fressen. Du legst die Rute ab und wartest auf den Biss. Ideal für Ansitz, Nacht und Strömung.",
 geraet:[["Rute","Grundrute 3,00 bis 3,60 m mit 40 bis 80 g Wurfgewicht."],["Rolle","Stationärrolle Größe 4000, gern mit Freilauf."],["Schnur","Monofile Schnur 0,25 bis 0,30 mm."],["Blei","Lauf- oder Birnenblei 20 bis 60 g, in der Strömung so schwer, dass es gerade liegen bleibt."],["Bissanzeiger","Rutenspitze, Einhängebissanzeiger, Aalglocke oder elektronischer Bissanzeiger."]],
 sek:[["Montage",["Laufblei auf die Hauptschnur fädeln, dann eine Perle als Knotenschutz und einen Wirbel.","Vorfach 40 bis 70 cm mit passendem Haken in den Wirbel hängen.","Der Fisch kann beim Biss Schnur durch das Blei ziehen, ohne Widerstand zu spüren."]],
 ["Ablegen und Biss erkennen",["Auswerfen, das Blei absinken lassen und die Schnur leicht spannen.","Rute auf zwei Rutenhaltern ablegen, Bissanzeiger einhängen, Freilauf oder Bremse lösen.","Zuckt die Spitze nur, warten. Läuft Schnur ab oder biegt sich die Spitze durch, Rute aufnehmen und anschlagen.","Auf Aal und Zander dem Fisch kurz Zeit geben, bei Barbe und Karpfen hakt sich der Fisch oft selbst."]],
 ["Der richtige Platz",["Rinnen, Kanten, Buhnenkessel und Außenkurven. Im Stillwasser Scharkanten und Löcher.","Nachts ziehen Aal und Zander ins Flache, dann reicht oft ein Wurf von wenigen Metern.","Ein paar Hände Futter oder zerschnittene Würmer am Platz halten die Fische dort."]]],
 fehler:["Das Blei zu leicht in der Strömung. Die Montage rollt in den nächsten Hänger.","Die Bremse zu fest und die Rute ungesichert. Ein Karpfen zieht sie ins Wasser.","Zu früh anschlagen bei Aal und Zander.","Ohne Lampe, Kescher und Hakenlöser in die Nacht starten."],
 b:["tauwurm","koederfisch","fetzen","mais","pellet","leber_kaese","made"],r:["laufblei","seitenarm","auftrieb","tiroler","aal"],s:["aussenkurve","buhne","kante","steinpackung","einlauf"],k:["clinch","palomar","uni","plaettchen"]},
{id:"feedern",n:"Feedern",kurz:"Grundangeln mit Futterkorb und feiner Spitze",f:["brasse","rotauge","barbe","karpfen","schleie","doebel","aland","karausche"],
 info:"Ein Futterkorb bringt das Futter genau zum Haken. Die weiche Rutenspitze zeigt selbst vorsichtige Bisse. Die erfolgreichste Methode auf Friedfische am Grund.",
 geraet:[["Rute","Feederrute 3,30 bis 3,90 m mit Wechselspitzen. Leichte Spitze für Stillwasser, härtere für Strömung."],["Rolle","Stationärrolle Größe 4000 mit Schnurclip."],["Schnur","Monofile 0,20 bis 0,25 mm oder dünne geflochtene mit Schlagschnur."],["Korb","Drahtkorb 20 bis 40 g im Stillwasser, 60 bis 120 g im Fluss. Method-Korb für Karpfen im Teich."],["Dazu","Feederfutter, Futtereimer, Rutenablage, feine Vorfächer mit Haken 10 bis 16."]],
 sek:[["Platz anlegen",["Such dir am anderen Ufer einen festen Zielpunkt, zum Beispiel einen Baum.","Wirf auf die gewünschte Entfernung und klemm die Schnur in den Schnurclip. So landet jeder Wurf gleich weit.","Zum Start fünf bis acht gefüllte Körbe schnell hintereinander werfen, ohne Haken. Das ist dein Futterplatz."]],
 ["Fischen",["Korb füllen, Köder an den Haken, werfen. Die Rute seitlich im rechten Winkel ablegen und die Spitze leicht spannen.","Biss: Die Spitze zuckt, biegt sich oder federt zurück. Ruhig seitlich anheben.","Ohne Biss nach drei bis fünf Minuten neu werfen. Der Rhythmus bringt das Futter und die Fische.","Kommen viele Fehlbisse, das Vorfach verlängern. Kommen keine Bisse, obwohl Fische da sind, verkürzen."]],
 ["Method-Feeder",["Futter oder eingeweichte Pellets mit der Form fest auf den Korb pressen, der kurze Vorfachhaken mit Köder liegt obenauf.","Der Fisch saugt Futter und Köder ein und hakt sich am Korbgewicht selbst.","Nicht anschlagen, nur die Rute aufnehmen. Ideal für Karpfen und Schleien im Teich."]]],
 fehler:["Ungenau werfen. Fünf Meter daneben ist ein anderer Futterplatz.","Zu selten neu werfen. Feedern lebt vom Takt.","Zu nasses Futter. Es löst sich nicht aus dem Korb.","Die Spitze zu stark spannen, dann siehst du die Rückfaller nicht."],
 b:["made","mais","rotwurm","pellet","tauwurm","boilie"],r:["feeder","method","helikopter"],s:["buhne","aussenkurve","kante","einlauf"],k:["chirurg","schlaufe2","doppeluni","plaettchen"]},
{id:"karpfenangeln",n:"Karpfenangeln",kurz:"Ansitz mit Boilie, Haar und Selbsthakmontage",f:["karpfen","graskarpfen","schleie","stoer","brasse"],
 info:"Modernes Karpfenangeln arbeitet mit dem Haar: Der Köder hängt neben dem Haken, der Karpfen saugt ihn ein und hakt sich am Blei selbst. Dazu gehören Geduld, ein gut gewählter Platz und schonender Umgang mit dem Fisch.",
 geraet:[["Rute","Karpfenrute 3,60 m (12 Fuß) mit 2,75 bis 3 lb Testkurve."],["Rolle","Freilauf- oder Weitwurfrolle Größe 6000 bis 8000."],["Schnur","Monofile 0,30 bis 0,35 mm, bei Hindernissen eine Schlagschnur davor."],["Montage","Safety-Clip mit Blei 80 bis 110 g, Vorfach 15 bis 25 cm, Haken Größe 4 bis 8 mit Haar."],["Am Ufer","Rod Pod oder Banksticks, elektronische Bissanzeiger, großer Kescher, Abhakmatte, Wunddesinfektion."]],
 sek:[["Platz finden",["Karpfen verraten sich: springende Fische, Blasenteppiche, aufgewühlter Grund, wackelndes Schilf.","Gute Plätze sind Kanten, Plateaus, Seerosen, Schilf und versunkenes Holz.","Den Grund mit Blei oder Markerrute abtasten. Harter Grund neben weichem ist ideal."]],
 ["Füttern und Montage",["Boilie mit der Boilienadel aufs Haar ziehen und mit einem Stopper sichern.","Montage auswerfen oder auslegen, ein bis zwei Hände Boilies, Pellets und Partikel eng darum verteilen.","Rute ablegen, Schnur leicht spannen, Bissanzeiger scharf stellen und den Freilauf öffnen.","An neuen Gewässern lieber wenig füttern und beweglich bleiben."]],
 ["Biss, Drill und Versorgen",["Beim Dauerton die Rute aufnehmen, Freilauf schließen und ruhig Druck aufbauen. Kein harter Anhieb nötig.","Den Fisch über die Bremse müde machen und von Hindernissen fernhalten.","Im Kescher lassen, Abhakmatte nass machen, erst dann den Fisch herausheben.","Haken lösen, kurz fotografieren, tief über der Matte halten und zügig zurücksetzen, sofern die Regeln das vorsehen."]]],
 fehler:["Ohne Abhakmatte und großen Kescher angeln. Der Fisch geht vor.","Zu viel Futter an einem unbekannten Gewässer.","Stumpfe Haken. Vor jedem Wurf am Fingernagel prüfen.","Die Entnahme- und Nachtangelregeln des Gewässers nicht kennen."],
 b:["boilie","mais","pellet","frucht","tauwurm"],r:["haar","inline","helikopter","chod","ronnie","blowback","zig","schneemann","method"],s:["seerosen","schilf","kante","totholz","kraut"],k:["noknot","palomar","chirurg","albright"]},
{id:"stippen",n:"Stippen",kurz:"Kopfrute ohne Rolle, schnell und fein",f:["rotauge","rotfeder","brasse","karausche","barsch","schleie"],
 info:"Gestippt wird mit einer langen Rute ohne Rolle. Die Schnur ist fest an der Spitze, die Montage sehr fein. Du fängst damit schnell viele Fische, zum Beispiel Köderfische.",
 geraet:[["Rute","Stipprute 4 bis 7 m. Die Schnur ist etwa so lang wie die Rute."],["Schnur","Hauptschnur 0,12 bis 0,16 mm, Vorfach 0,08 bis 0,12 mm."],["Pose","Feine Pose 0,5 bis 2 g, mit Bleischroten in einer Kette austariert."],["Haken","Größe 14 bis 20, dünndrähtig."],["Dazu","Sitzkiepe oder Eimer, Futterschale, Kescher, Hakenlöser."]],
 sek:[["Aufbau",["Fertige Stippmontagen auf Wickelbrettchen sind für den Anfang ideal. Schlaufe in die Rutenspitze hängen, fertig.","Tiefe genau ausloten: Der Köder soll gerade so den Grund berühren.","Bleikette so setzen, dass nur die Antenne der Pose herausschaut."]],
 ["Fischen",["Zwei bis drei kleine Futterballen an die Pose setzen, dann alle paar Minuten eine Prise Maden nachwerfen.","Montage mit einem Unterhandschwung ablegen und leicht in der Strömung oder im Wind mitführen.","Jeden Zupfer der Pose mit einem kurzen Anheben quittieren. Kleine Fische direkt herausheben, größere keschern."]]],
 fehler:["Zu grobe Montage. Stippen lebt von dünner Schnur und kleinen Haken.","Unruhig füttern, mal viel, mal gar nicht.","Die Rute unter Stromleitungen aufbauen. Kohlefaser leitet Strom, das ist lebensgefährlich."],
 b:["made","rotwurm","mais","brot","teig_forelle"],r:["feststellpose"],s:["steg","schilf","einlauf","seerosen"],k:["chirurg","schlaufe2","plaettchen"]},
{id:"forellensee",n:"Forellensee",kurz:"Schleppen, Tremarella und Spoons am Angelteich",f:["regenbogen","bachforelle","saibling","lachs","stoer"],
 info:"Am Forellensee gelten eigene Techniken, weil die Fische im Freiwasser ziehen und oft wählerisch sind. Wer Tiefe und Tempo trifft, fängt.",
 geraet:[["Rute","Leichte Rute 3,00 bis 3,60 m mit 5 bis 25 g für Sbirolino und Pose, kurze Ultralight-Rute 1,80 bis 2,10 m für Spoons."],["Rolle","Stationärrolle Größe 2000 bis 2500."],["Schnur","Monofile 0,18 bis 0,22 mm oder sehr dünne geflochtene mit Fluorocarbon."],["Vorfach","Fluorocarbon 0,14 bis 0,18 mm, beim Schleppen 1,5 bis 2,5 m lang."],["Köder","Forellenteig, Bienenmaden, kleine Spoons und Gummis."]],
 sek:[["Tiefe finden",["Morgens und bei kaltem Wasser stehen die Fische oft tief, bei Wärme und Wind an der Oberfläche und an Einläufen.","Fang flach an und zähle bei jedem Wurf zwei Sekunden länger absinken, bis der erste Biss kommt.","Die Tiefe und das Tempo merken, dann genauso weiterfischen."]],
 ["Schleppen mit Sbirolino oder Pose",["Schwimmteig so formen, dass er sich beim Einholen dreht, oder zwei Bienenmaden im Winkel aufziehen.","Weit auswerfen und sehr langsam und gleichmäßig einholen.","Beim Biss kurz nachgeben, dann ruhig anschlagen."]],
 ["Tremarella und Spoons",["Tremarella: Beim Einholen die Rutenspitze ständig zittern lassen. Das Zittern überträgt sich auf den Köder.","Spoons: kleine Blinker von 2 bis 5 g langsam einkurbeln, gerade so schnell, dass sie spielen.","Farbe wechseln, wenn Nachläufer nicht beißen."]]],
 fehler:["Den ganzen Tag dieselbe Tiefe fischen.","Zu schnell einholen.","Zu dickes Vorfach in klarem Wasser.","Die Teichregeln nicht lesen: Hakenzahl, erlaubte Köder und Fangbegrenzung sind überall anders."],
 b:["teig_forelle","made","inline_spoon","spinner","twister","tauwurm"],r:["sbirolino","tremarella","bodentaster","teichschlepp","laufpose"],s:["einlauf","steg"],k:["clinch","chirurg","stopper"]},
{id:"vertikal",n:"Vertikalangeln",kurz:"Direkt unter dem Boot oder am Spundwand-Rand",f:["zander","barsch","hecht","dorsch","seeforelle","renke"],
 info:"Du lässt den Köder senkrecht unter der Rutenspitze ab und führst ihn knapp über Grund oder vor die Fische, die das Echolot zeigt. Sehr genau und im kalten Wasser besonders erfolgreich.",
 geraet:[["Rute","Kurze, straffe Vertikalrute 1,80 bis 2,00 m mit 10 bis 40 g."],["Rolle","Kleine Stationärrolle oder Baitcaster."],["Schnur","Dünne geflochtene 0,08 bis 0,12 mm mit Fluorocarbon-Vorfach, bei Hecht Stahl."],["Köder","Schlanke Gummifische mit V-Schwanz oder Pintail an 14 bis 28 g, dazu Zocker und Balance-Jigs."],["Boot","Echolot und Elektromotor oder Driftsack, damit die Schnur senkrecht bleibt."]],
 sek:[["Technik",["Köder bis zum Grund ablassen und zwei Handbreit anheben.","Kleine Bewegungen: anheben, halten, langsam wieder ablassen bis zum Grundkontakt. Meist ist weniger mehr.","Langsam driften und dabei Kanten und Löcher absuchen.","Der Biss ist oft nur ein leichtes Tock oder plötzliches Gewicht. Sofort anschlagen."]],
 ["Ohne Boot",["An Spundwänden, Stegen, Hafenmauern und Brücken geht es genauso: Köder am Rand ablassen und Meter für Meter weitergehen.","Mit dem Dropshot-Rig bleibt der Köder dabei lange an einer Stelle."]]],
 fehler:["Den Köder zu wild bewegen.","Zu leichter Kopf bei Drift, die Schnur steht dann schräg und du verlierst den Kontakt.","Fische aus großer Tiefe schnell hochpumpen. Aus mehr als 10 m langsam drillen und Fische zügig versorgen."],
 b:["gummifisch","pintail","dropshot","zocker","jig_metall","koederfisch"],r:["jigkopf","dropshot","damiki","angsthaken"],s:["kante","berg","bruecke","steg"],k:["fg","doppeluni","palomar"]},
{id:"schleppen",n:"Schleppangeln",kurz:"Köder hinter dem fahrenden Boot",f:["hecht","zander","seeforelle","lachs","meerforelle","barsch","wels","makrele"],
 info:"Der Köder läuft hinter dem langsam fahrenden Boot. So suchst du große Wasserflächen ab und findest Fische im Freiwasser. Vorher prüfen: Schleppen ist nicht an jedem Gewässer erlaubt.",
 geraet:[["Rute","Kräftige Rute 2,10 bis 2,70 m mit 30 bis 100 g und weicher Spitze."],["Rolle","Multirolle mit Zählwerk oder kräftige Stationärrolle."],["Schnur","Geflochtene 0,15 bis 0,20 mm mit langem Fluorocarbon-Vorfach, bei Hecht Stahl."],["Köder","Tief laufende Wobbler, große Gummifische, Blinker, Köderfisch am System."],["Boot","Rutenhalter, Echolot, großer Kescher. Für die Tiefe Tauchscheibe, Paravan oder Downrigger."]],
 sek:[["So geht es",["Tempo 2 bis 4 km/h, im kalten Wasser langsamer.","Köder 20 bis 50 m hinter dem Boot auslassen und prüfen, ob er sauber läuft.","Entlang von Kanten, über Barschbergen und an Futterfischschwärmen fahren, die das Echolot zeigt.","Kurven fahren: Der innere Köder wird langsamer und sinkt, der äußere wird schneller. Oft kommt genau dann der Biss."]],
 ["Biss und Drill",["Die Bremse so einstellen, dass der Fisch sich beim Biss selbst hakt.","Boot auskuppeln, die anderen Ruten einholen und den Fisch in Ruhe drillen."]]],
 fehler:["Ohne Blick auf die Regeln schleppen. Rutenzahl, Motor und Schonbezirke sind oft geregelt.","Zu schnell fahren.","Köder ungeprüft auslassen. Ein Krautfaden am Haken und er fängt nichts mehr."],
 b:["wobbler_tief","gummifisch","blinker","koederfisch","trolling","swimbait"],r:["trolling","spinn"],s:["kante","berg"],k:["fg","doppeluni","crimp"]},
{id:"wels",n:"Welsangeln",kurz:"Ansitz, Spinnfischen und Klopfen auf den größten Räuber",f:["wels","catfish_us"],
 info:"Der Wels ist der größte Raubfisch in unseren Gewässern. Geangelt wird auf ihn mit sehr kräftigem Gerät: beim Ansitz mit Köderfisch oder Wurmbündel, aktiv mit großen Kunstködern oder vom Boot mit dem Wallerholz.",
 geraet:[["Rute","Welsrute 2,70 bis 3,00 m mit 200 bis 400 g Wurfgewicht, zum Spinnfischen 100 bis 200 g."],["Rolle","Große Stationärrolle 8000 bis 10000 oder Multirolle mit starker Bremse."],["Schnur","Geflochtene 0,40 bis 0,60 mm."],["Vorfach","Abriebfestes Welsvorfach mit 1,0 bis 1,2 mm, starke Einzelhaken oder Drillinge."],["Dazu","Handschuh für den Wallergriff, Maßband, starke Lampe, Rutenhalter, die wirklich halten."]],
 sek:[["Ansitz",["Plätze: tiefe Löcher, Außenkurven, Buhnenkessel, versunkene Bäume, Einläufe. Nachts zieht der Wels ins Flache.","Köder mit einer Unterwasserpose knapp über Grund anbieten oder an einer Boje abspannen.","Tauwurmbündel, Köderfisch (wo erlaubt), Pellets oder Calamari als Köder.","Bremse hart einstellen und die Rute sichern. Der Biss ist brutal."]],
 ["Aktiv",["Spinnfischen mit großen Gummifischen, Blinkern und Wobblern, langsam und grundnah geführt.","Klopfen vom Boot: Das Wallerholz erzeugt ein Plopp, das Welse anlockt. Der Köder hängt senkrecht darunter.","Im Sommer bei warmem, steigendem Wasser sind Welse am aktivsten."]]],
 fehler:["Zu schwaches Gerät. Ein Wels verzeiht nichts.","Die Rute nicht sichern.","Allein und ohne Plan für die Landung losziehen. Große Welse landet man zu zweit.","Regeln zum Köderfisch und zur Entnahme nicht kennen. Sie sind je Bundesland sehr verschieden."],
 b:["tauwurm","koederfisch","pellet_wels","gummifisch","blinker","tintenfisch"],r:["upose","abspann","boje","klopf","laufblei"],s:["aussenkurve","totholz","buhne","bruecke"],k:["palomar","uni","crimp"]},
{id:"eisangeln",n:"Eisangeln",kurz:"Durchs Eisloch mit Mormyschka und Zocker",f:["barsch","hecht","zander","rotauge","renke","saibling","quappe"],
 info:"Im Winter angelst du durch ein Loch im Eis senkrecht nach unten. Die Fische sind träge, die Köder klein, die Bewegungen fein. Sicherheit geht immer vor dem Fisch.",
 geraet:[["Rute","Kurze Eisangel 50 bis 80 cm mit feiner Spitze oder Bissanzeiger."],["Schnur","Monofile 0,10 bis 0,18 mm, sie friert weniger ein als geflochtene."],["Köder","Mormyschka mit Made, kleine Zocker, Balance-Jigs, kleine Köderfische für Hecht."],["Eisbohrer","Handbohrer mit 100 bis 150 mm, dazu eine Kelle zum Freihalten des Lochs."],["Sicherheit","Eispickel um den Hals, Wurfleine, warme Kleidung in Schichten, nie allein."]],
 sek:[["Sicherheit zuerst",["Klares Kerneis trägt eine Person ab etwa 8 bis 10 cm, besser sind 12 cm und mehr. Schneeeis und Eis über Strömung tragen deutlich schlechter.","Die Eisdicke immer wieder selbst messen. Einläufe, Schilf, Brücken und Stege meiden.","Betretungsverbote und die Freigabe des Gewässers beachten."]],
 ["Technik",["Mehrere Löcher an Kanten und Barschbergen bohren und der Reihe nach abfischen.","Köder zum Grund lassen, leicht anheben und mit kleinen Zitterbewegungen spielen. Immer wieder ruhig stehen lassen.","Beißt nach zehn Minuten nichts, zum nächsten Loch wechseln.","Fische und Hände vor Frost schützen, gefangene Fische zügig versorgen."]]],
 fehler:["Auf fremde Spuren vertrauen statt selbst zu messen.","Zu große Köder und zu heftige Bewegungen.","Löcher offen und unmarkiert zurücklassen."],
 b:["zocker","made","rotwurm","koederfisch","jig_metall"],r:["damiki","dropshot"],s:["berg","kante"],k:["clinch","palomar"]},
{id:"brandungsangeln",n:"Brandungsangeln",kurz:"Vom Strand weit hinaus auf Platte und Dorsch",f:["plattfisch","dorsch","steinbutt","wolfsbarsch","aal","hornhecht","meerbrasse"],
 info:"Du stehst am Strand und wirfst eine Grundmontage mit Naturköder in die Rinnen hinter der Brandung. Die beste Zeit ist die Dämmerung bei auflandigem Wind.",
 geraet:[["Rute","Brandungsrute 3,90 bis 4,20 m mit 100 bis 250 g Wurfgewicht."],["Rolle","Große Weitwurfrolle Größe 7000 bis 10000."],["Schnur","Monofile 0,28 bis 0,35 mm mit Schlagschnur 0,60 bis 0,70 mm oder verjüngter Keulenschnur."],["Blei","Krallenblei 125 bis 200 g bei Strömung und Wellen, sonst glattes Blei."],["Dazu","Dreibein oder Strandspieß, Knicklichter für die Rutenspitze, Wattwurmnadel, Kopflampe."]],
 sek:[["Strand lesen",["Bei Tag ansehen: Wo die Wellen brechen, liegt eine Sandbank. Das ruhige, dunkle Wasser dazwischen ist die Rinne.","Die Köder gehören in die Rinnen und an die Kanten der Sandbank.","Steine, Tang und Muschelbänke bringen zusätzlich Fisch, kosten aber Montagen."]],
 ["Fischen",["Wattwurm oder Seeringler mit der Ködernadel aufziehen, bis der Haken ganz bedeckt ist.","Weit werfen, Schnur spannen, Rute steil ins Dreibein stellen.","Biss: Die Spitze nickt oder die Schnur fällt durch. Kurz warten, dann anschlagen und gleichmäßig einholen.","Alle 15 bis 20 Minuten den Köder erneuern. Frischer Duft fängt."]]],
 fehler:["Immer nur auf Weite werfen. Abends stehen die Fische oft in der ersten Rinne.","Ohne Schlagschnur voll durchziehen. Das Blei reißt ab und wird zum Geschoss.","Bei ablandigem Wind und glasklarem Wasser am Tag auf Wunder hoffen."],
 b:["wattwurm","seeringler","fetzen","garnele","muschel","kuestenblinker"],r:["brandung","pulley","buttloeffel","nachlaeufer","seitenarm"],s:["rinne"],k:["uni","dropper","doppeluni","clinch"]},
{id:"meeresangeln",n:"Meeresangeln vom Boot",kurz:"Pilken, Jiggen und Naturköder auf Dorsch und Co.",f:["dorsch","koehler","pollack","leng","heilbutt","makrele","hering","plattfisch","wolfsbarsch"],
 info:"Vom Kutter oder Kleinboot angelst du über Wracks, Kanten und Steinfeldern. Je nach Zielfisch mit Pilker, Gummifisch, Paternoster oder Naturködermontage.",
 geraet:[["Rute","Pilkrute 2,40 bis 3,00 m mit 80 bis 200 g für die Ostsee, für Norwegen 20 bis 30 lb."],["Rolle","Stationärrolle 5000 bis 6000 oder Multirolle."],["Schnur","Geflochtene 0,15 bis 0,20 mm, mehrfarbig, damit du die Tiefe ablesen kannst."],["Köder","Pilker 60 bis 150 g, Gummifische an 30 bis 100 g, Beifänger, Heringspaternoster, Wattwurm."],["Sicherheit","Rettungsweste tragen, Wetterbericht ansehen, gegen Seekrankheit vorsorgen."]],
 sek:[["Pilken und Jiggen",["Den Köder zum Grund ablassen, die Schnur spannen und die Rute zügig anheben, dann an gespannter Schnur absinken lassen.","Die meisten Bisse kommen beim Absinken. Stoppt der Köder früher als erwartet, anschlagen.","In der Drift schräg voraus werfen und den Köder unter dem Boot durcharbeiten.","Gummifisch statt Pilker bringt oft die besseren Fische und weniger Hänger."]],
 ["Naturköder und Paternoster",["Auf Plattfisch mit Buttlöffel oder Nachläufer und Wattwurm langsam über Sandgrund driften.","Hering und Makrele mit dem Paternoster: ablassen und in der Schwarmtiefe leicht heben und senken.","Auf Leng und Heilbutt Fischfetzen oder ganzen Köderfisch am Grund anbieten."]]],
 fehler:["Zu schwer fischen. So leicht wie möglich, so schwer wie nötig.","Die Schnur schräg ablaufen lassen und in die Schnüre der Nachbarn geraten.","Fangbegrenzungen und Mindestmaße nicht kennen. Für Dorsch und Lachs ändern sie sich fast jedes Jahr."],
 b:["pilker","gummi_salz","jig_metall","sabiki","wattwurm","fetzen","koederfisch_tot_meer"],r:["pilk","hering","buttloeffel","nachlaeufer","assist","fishfinder","highlow"],s:["kante","rinne"],k:["fg","palomar","dropper","crimp"]},
{id:"biggame",n:"Big Game und Tropen",kurz:"Trolling, Popping und Jigging auf die ganz Großen",f:["marlin","yellowfin","bluefin","mahi","wahoo","gt","tarpon","amberjack","barrakuda","roosterfish"],
 info:"In warmen Meeren geht es auf Thun, Marlin, Goldmakrele und Giant Trevally. Geangelt wird meist mit Guide und Charterboot, der das schwere Gerät stellt. Wer die Techniken kennt, hat mehr davon.",
 geraet:[["Trolling","Stand-up-Ruten 30 bis 80 lb mit Multirollen, Schleppköder und Naturköder am Kreishaken."],["Popping","Kräftige Popperrute 2,40 m für Köder von 80 bis 150 g, Rolle 10000 bis 18000, geflochtene PE 6 bis 8."],["Jigging","Kurze Jigrute, Metalljigs 100 bis 300 g mit Assist-Haken."],["Vorfach","Fluorocarbon oder Mono 80 bis 200 lb, mit FG-Knoten oder Quetschhülsen verbunden."],["Dazu","Kampfgurt, Handschuhe, Sonnenschutz, viel Wasser."]],
 sek:[["Die drei Techniken",["Trolling: Mehrere Köder laufen hinter dem Boot im Kielwasser. Beim Biss fährt der Kapitän weiter, damit der Haken sitzt.","Popping: Den Popper weit werfen und mit kräftigen Zügen Wasser spritzen lassen. Der Biss an der Oberfläche ist gewaltig.","Speed Jigging: Den Jig zum Grund ablassen und mit schnellen Pumpbewegungen hochholen."]],
 ["Drill",["Mit dem Körper arbeiten, nicht mit den Armen: Rute anheben, beim Absenken Schnur gewinnen.","Die Bremse vorher mit der Waage einstellen, etwa ein Drittel der Schnurtragkraft.","Auf die Crew hören. Sie kennt Fisch, Boot und Revier."]]],
 fehler:["Die Bremse im Drill zudrehen. So reißen Schnur und Knoten.","Knoten nicht prüfen. Bei diesen Fischen hält nur, was sauber gebunden ist.","Fische lange aus dem Wasser nehmen, die zurückgesetzt werden sollen."],
 b:["trolling","topwater_popper","jig_metall","livebait_meer","tintenfisch_koeder","meeresfliege"],r:["trolling","assist","fishfinder","knocker","freeline"],s:[],k:["fg","crimp","palomar","albright"]},
{id:"ultralight",n:"Ultralight und Streetfishing",kurz:"Feinstes Gerät, kleine Köder, mitten in der Stadt",f:["barsch","bachforelle","regenbogen","doebel","rapfen","zander","rotfeder","aland"],
 info:"Mit sehr leichtem Gerät und winzigen Ködern wird jeder Barsch zum Erlebnis. Besonders beliebt in Städten an Kanälen, Häfen und Flüssen: wenig Gepäck, viel Strecke.",
 geraet:[["Rute","Ultralight-Rute 1,80 bis 2,20 m mit 0,5 bis 7 g Wurfgewicht."],["Rolle","Stationärrolle Größe 1000 bis 2000."],["Schnur","Geflochtene 0,04 bis 0,08 mm oder Monofile 0,14 bis 0,18 mm, davor Fluorocarbon 0,16 bis 0,22 mm."],["Köder","Gummis von 3 bis 7 cm, kleine Spinner, Mini-Wobbler, Spoons von 2 bis 5 g."],["Dazu","Kleiner Rucksack, Watkescher, Lösezange, Polbrille."]],
 sek:[["Wo und wie",["Schatten und Struktur suchen: Brücken, Spundwände, Boote, Stege, Einläufe, Steinpackungen.","Dicht an der Wand entlang fischen statt weit hinaus. Die Barsche stehen oft direkt vor deinen Füßen.","Dropshot und kleine Jigs langsam am Grund führen, Mini-Wobbler und Spinner im Mittelwasser.","Nach ein paar Würfen weitergehen. Wer viele Stellen fischt, findet die Trupps."]],
 ["In der Stadt",["Vorher klären, welche Karte gilt und wo Angeln verboten ist, etwa an Schleusen, Brücken und in Häfen.","Auf Passanten achten, vor allem beim Ausholen.","Einen Hecht kannst du auch an feinem Gerät landen, wenn du geduldig drillst. Wo Hechte häufig sind, ein dünnes Stahlvorfach vorschalten."]]],
 fehler:["Zu schwere Jigköpfe. Bei Ultralight reichen oft 1 bis 3 g.","Zu harte Bremse an dünner Schnur.","Müll und Schnurreste liegen lassen. Das kostet uns allen die Angelplätze."],

];
// Rute und Rolle: Grundwissen, Rutenarten, Rollenarten und fertige Kombinationen je Zielfisch (Richtwerte)
window.GEAR={
wissen:[
["Rute: Länge","Kurze Ruten (1,80 bis 2,40 m) sind genau, leicht und ideal vom Boot, am Bach und beim Jiggen. Lange Ruten (2,70 bis 3,90 m) werfen weiter, halten Schnur über Kraut und Steinpackung und führen Posen besser. Faustregel: vom Ufer eher lang, vom Boot eher kurz."],
["Rute: Wurfgewicht","Das Wurfgewicht (WG, in Gramm) sagt, mit welchem Ködergewicht die Rute am besten wirft. Der Köder samt Blei sollte in der Mitte des Bereichs liegen. Zu leicht: Du spürst nichts und wirfst kurz. Zu schwer: Die Rute kann brechen. Karpfen- und Grundruten haben stattdessen oft eine Testkurve in lb: 2,75 lb entsprechen etwa 80 g Wurfgewicht."],
["Rute: Aktion","Spitzenaktion (fast): Nur das obere Drittel biegt sich. Schneller Anhieb, gutes Ködergefühl, richtig für Gummifisch und Jig. Semiparabolisch (medium): biegt sich bis zur Mitte, der Allrounder für Wobbler, Spinner und Posen. Parabolisch (slow): biegt sich bis ins Handteil, federt Fluchten ab und schont dünne Vorfächer, gut für Forelle, Matchangeln und Karpfen."],
["Rute: Teilung und Transport","Zweiteilige Steckruten haben die beste Aktion. Teleskopruten sind praktisch für Urlaub und Rucksack, aber weniger feinfühlig. Reiseruten mit vier bis fünf Teilen sind ein guter Mittelweg."],
["Rute: Ringe und Griff","Viele kleine Ringe verteilen die Last gleichmäßig. Für geflochtene Schnur harte Einlagen wählen (SiC oder ähnlich). Kork liegt warm in der Hand, Schaumstoff (EVA oder Duplon) ist unempfindlich. Der Griff soll bis zum Ellenbogen reichen, dann ermüdet der Arm nicht."],
["Rolle: Größe","Die Zahl nennt die Größe: 1000 bis 2500 für Ultralight, Barsch und Forelle, 3000 bis 4000 für Zander, Hecht und Feeder, 5000 bis 6000 für Karpfen, Wels leicht und Brandung, ab 8000 für Wels schwer und Meer. Die Rolle muss die Rute ausbalancieren: Der Schwerpunkt liegt kurz vor dem Rollenfuß."],
["Rolle: Übersetzung","5,2:1 heißt: Eine Kurbelumdrehung dreht den Rotor 5,2-mal. Wichtiger ist der Schnureinzug je Kurbelumdrehung in Zentimetern. Niedrig (bis 70 cm) bringt Kraft für Wobbler und schwere Fische, hoch (ab 85 cm) holt Schnur schnell ein, gut für Jiggen und Rapfen."],
["Rolle: Bremse","Die Frontbremse (Knopf vorn auf der Spule) arbeitet feiner und hält mehr aus, sie ist Standard beim Spinnfischen. Die Heckbremse lässt sich im Drill leichter verstellen. Der Freilauf gibt auf Hebeldruck Schnur fast ohne Widerstand frei, für Karpfen, Aal und Köderfisch. Bremse so einstellen, dass sie bei etwa einem Drittel der Schnurtragkraft Schnur freigibt, und vor dem ersten Wurf mit der Hand prüfen."],
["Rolle: Schnurfassung und Spule","Die Angabe 0,25 mm / 150 m sagt, wie viel Schnur passt. Flache Spulen (Shallow) sind für dünnes Geflecht gedacht. Bei tiefen Spulen mit alter Mono unterfüttern. Die Spule bis 1 bis 2 mm unter den Rand füllen, sonst gibt es Perücken oder kurze Würfe."],
["Schnur: Mono, Geflecht, Fluorocarbon","Monofil dehnt sich, verzeiht Fehler und ist günstig: gut für Pose, Grund, Forelle und Karpfen. Geflochtene Schnur dehnt sich kaum, ist bei gleichem Durchmesser viel stärker und überträgt jeden Zupfer: richtig für Gummifisch, Jig und große Tiefen, immer mit Vorfach. Fluorocarbon ist unter Wasser fast unsichtbar und abriebfest, es dient als Vorfach, schützt aber nicht vor Hechtzähnen."],
["Pflege","Nach Salzwasser Rute und Rolle mit Süßwasser abbrausen, nie mit hartem Strahl. Bremse zum Lagern lösen. Rolle einmal im Jahr leicht ölen (Schnurlaufröllchen, Kurbelknauf). Rute nicht an der Spitze aus dem Futteral ziehen und Steckverbindungen sauber halten."]

function recommend(w){
  var f=F[w.fish],cold=w.temp===0,warm=w.temp===2,tz=tzCode(w.tz),out=[];
  f.b.forEach(function(e){
    var b=B[e[0]];if(!b)return;
    if(w.art!=="alle"&&b.t!==w.art)return;
    var s=e[1]*10,why=[];
    var top=b.tiefe==="o"&&b.t==="K";
    if(cold){ if(b.tempo===1){s+=4;why.push("langsam, passt zu kaltem Wasser")} if(b.tempo===3)s-=4; if(top)s-=7; if(b.tiefe==="g")s+=2 }
    if(warm){ if(top){s+=4;why.push("warmes Wasser: Fische jagen oben")} if(b.tempo===3)s+=2 }
    if(w.wasser==="trueb"){ if(b.laut>=2){s+=3;why.push("viel Druck/Reiz für trübes Wasser")} if(b.t==="N"){s+=3;why.push("Duft wirkt im Trüben")} if(b.t==="K"&&b.laut===0)s-=3 }
    if(w.wasser==="klar"){ if(b.laut<=1&&b.t==="K"){s+=2;why.push("dezent, gut bei klarem Wasser")} if(b.laut===3)s-=2 }
    if(tz==="n"){ if(b.t==="N"){s+=3;why.push("nachts fängt Naturköder am sichersten")} if(b.laut>=2)s+=1; if(b.t==="K"&&b.laut===0)s-=2 }
    if(tz==="d"&&top&&!cold){s+=3;why.push("Dämmerung ist Oberflächenzeit")}
    if(w.wetter==="sonne"){ if(top&&tz==="t")s-=3; if(b.tiefe==="g"){s+=1} }
    if(w.wetter==="regen"){ if(b.id==="tauwurm"||b.id==="rotwurm"){s+=3;why.push("Regen spült Würmer ins Wasser")} if(b.laut>=2)s+=1 }
    if(w.wetter==="wind"){ if(b.laut>=2)s+=1; if(b.kat==="Fliege")s-=3; if(top)s-=1 }
    out.push({b:b,e:e,s:s,why:why});
  });
  out.sort(function(a,b){return b.s-a.s});
  return out;
}
function colorTip(w,b){
  var tz=tzCode(w.tz);
  if(b.t==="N")return w.wasser==="trueb"?"Größere Portion, zusätzlich Lockstoff oder Futter":"Frischer Köder, feines Vorfach";
  if(tz==="n")return "Dunkel (Schwarz, Violett) für die Silhouette oder UV/Glow";
  if(w.wasser==="trueb")return "Schockfarben: Chartreuse, Orange, Weiß, Firetiger";
  if(w.wasser==="klar")return w.wetter==="sonne"?"Natürlich: Braun, Grün, Silber, transparent mit Glitter":"Natürlich mit etwas Kontrast: Weißfisch-Dekor, Perlmutt";
  return tz==="d"?"Kontrastreich: Weiß, Motoroil, zweifarbig":"Zwischen Natur und Schock: Motoroil, Perlweiß, Ayu";
}
function tempoTip(w,b){
  if(b.t==="N")return null;
  if(w.temp===0)return "Kaltes Wasser: sehr langsam, lange Pausen, eher kleinere Köder dicht am Grund.";
  if(w.temp===2)return "Warmes Wasser: zügiger führen, flache und obere Wasserschichten absuchen.";
  return null;
}
